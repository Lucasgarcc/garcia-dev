            <path d="M90 118 C92 127 102 134 118 134 C134 134 144 125 144 114 C144 100 133 96 120 92 L114 90 C107 88 103 86 103 80 C103 75 108 72 116 72 C124 72 128 76 130 82 H143 C141 70 131 61 116 61 C100 61 89 70 89 82 C89 94 99 99 110 103 L116 105 C124 108 128 110 128 115 C128 121 122 123 116 123 C108 123 103 119 102 114 H90 Z" fill="url(#ts-text-face)"/>
