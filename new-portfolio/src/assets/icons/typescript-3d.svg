            <path d="M48 65 H88 V78 H75 V130 H59 V78 H48 V65 Z" fill="url(#ts-text-side)" transform="translate(2,2)"/>
            <path d="M48 65 H88 V78 H75 V130 H59 V78 H48 V65 Z" fill="url(#ts-text-face)"/>

