<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="react-blue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
            <radialGradient id="react-core" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0369a1"/>
            </radialGradient>
            <filter id="glow-react">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#glow-react)">
            <ellipse cx="100" cy="100" rx="75" ry="26" fill="none" stroke="url(#react-blue)" stroke-width="9" transform="rotate(0 100 100)"/>
            <ellipse cx="100" cy="100" rx="75" ry="26" fill="none" stroke="url(#react-blue)" stroke-width="9" transform="rotate(60 100 100)"/>
            <ellipse cx="100" cy="100" rx="75" ry="26" fill="none" stroke="url(#react-blue)" stroke-width="9" transform="rotate(120 100 100)"/>
            <circle cx="100" cy="100" r="18" fill="url(#react-core)"/>
            <circle cx="94" cy="94" r="5" fill="#ffffff" opacity="0.6"/>
          </g>
        </svg>