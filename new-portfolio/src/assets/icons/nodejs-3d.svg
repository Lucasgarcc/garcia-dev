<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="node-base" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#84cc16"/>
              <stop offset="50%" stop-color="#65a30d"/>
              <stop offset="100%" stop-color="#4d7c0f"/>
            </linearGradient>
            <linearGradient id="node-side" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3f6212"/>
              <stop offset="100%" stop-color="#1a2e05"/>
            </linearGradient>
            <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.4"/>
            </filter>
          </defs>
          <g filter="url(#node-shadow)">
            <!-- Bloco Tridimensional de Fundo -->
            <rect x="34" y="30" width="136" height="136" rx="28" fill="url(#node-side)"/>
            <rect x="28" y="24" width="136" height="136" rx="28" fill="url(#node-base)"/>
            <rect x="30" y="26" width="132" height="132" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

            <!-- Símbolo Hexagonal do Node e JS interno -->
            <g transform="translate(0, 4)">
              <!-- Hexágono com profundidade -->
              <path d="M100 48 L142 72 V120 L100 144 L58 120 V72 Z" fill="none" stroke="#334155" stroke-width="10" stroke-linejoin="round" transform="translate(0, 3)"/>
              <path d="M100 48 L142 72 V120 L100 144 L58 120 V72 Z" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linejoin="round"/>
              
              <!-- Letras JS internas estilizadas -->
              <!-- J -->
              <path d="M86 82 V112 C86 118 81 122 75 122 C69 122 65 118 65 112" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- S -->
              <path d="M125 86 C125 81 118 78 110 81 C102 84 99 88 99 93 C99 103 125 99 125 108 C125 114 117 117 109 114 C102 112 99 108 99 104" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
            </g>
          </g>
        </svg>